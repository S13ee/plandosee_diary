<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>플랜두씨 다이어리</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
    .hidden { display: none !important; }

    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      width: 360px;
    }
    .auth-box h1 { font-size: 22px; margin-bottom: 8px; }
    .auth-box p { color: #888; font-size: 14px; margin-bottom: 24px; }
    .auth-tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid #eee; }
    .auth-tab {
      flex: 1; padding: 10px; text-align: center;
      cursor: pointer; font-size: 14px; color: #888;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .auth-tab.active { color: #4f46e5; border-bottom-color: #4f46e5; font-weight: 600; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #555; }
    .form-group input {
      width: 100%; padding: 10px 12px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; outline: none;
    }
    .form-group input:focus { border-color: #4f46e5; }
    .btn-primary {
      width: 100%; padding: 12px;
      background: #4f46e5; color: white;
      border: none; border-radius: 8px;
      font-size: 15px; cursor: pointer; font-weight: 600;
    }
    .btn-primary:hover { background: #4338ca; }
    .auth-error {
      background: #fef2f2; color: #dc2626;
      padding: 10px 12px; border-radius: 8px;
      font-size: 13px; margin-bottom: 16px;
    }

    #app-screen { min-height: 100vh; }
    .top-bar {
      background: white; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .top-bar h1 { font-size: 18px; font-weight: 700; color: #4f46e5; }
    .top-bar-right { display: flex; align-items: center; gap: 12px; }
    .user-email { font-size: 13px; color: #888; }
    .btn-logout {
      padding: 7px 16px; background: #f3f4f6;
      border: none; border-radius: 8px;
      font-size: 13px; cursor: pointer; color: #333;
    }
    .btn-logout:hover { background: #e5e7eb; }
    .main-content { max-width: 900px; margin: 32px auto; padding: 0 16px; }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <h1>플랜두씨 다이어리</h1>
    <p>로그인하고 나만의 기록을 시작하세요</p>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">로그인</div>
      <div class="auth-tab" id="tab-signup" onclick="switchTab('signup')">가입</div>
    </div>
    <div id="auth-error" class="auth-error hidden"></div>

    <div id="form-login">
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="login-email" placeholder="example@email.com" />
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="login-password" placeholder="비밀번호 입력" />
      </div>
      <button class="btn-primary" onclick="handleLogin()">로그인</button>
    </div>

    <div id="form-signup" class="hidden">
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="signup-email" placeholder="example@email.com" />
      </div>
      <div class="form-group">
        <label>비밀번호 (6자 이상)</label>
        <input type="password" id="signup-password" placeholder="비밀번호 입력" />
      </div>
      <div class="form-group">
        <label>비밀번호 확인</label>
        <input type="password" id="signup-password2" placeholder="비밀번호 재입력" />
      </div>
      <button class="btn-primary" onclick="handleSignup()">가입하기</button>
    </div>
  </div>
</div>

<div id="app-screen" class="hidden">
  <div class="top-bar">
    <h1>📓 플랜두씨 다이어리</h1>
    <div class="top-bar-right">
      <span class="user-email" id="user-email-display"></span>
      <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
    </div>
  </div>
  <div class="main-content" id="main-content">
    <p style="color:#888; margin-top:40px; text-align:center;">로그인 완료! 다이어리 내용을 불러오는 중...</p>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://kdlnzkdltpccimhnbvdz.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbG56a2RsdHBjY2ltaG5idmR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzU4ODcsImV4cCI6MjEwNTAxMTg4N30._iv7SyzGqQWtlyRoZNgAuIVqMF8O0EpKNZBRmXHfPvs';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function switchTab(tab) {
    document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
    document.getElementById('form-signup').classList.toggle('hidden', tab !== 'signup');
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  function hideError() {
    document.getElementById('auth-error').classList.add('hidden');
  }

  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { showError('이메일과 비밀번호를 입력해주세요.'); return; }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showError('이메일 또는 비밀번호를 확인해주세요.'); return; }
  }

  async function handleSignup() {
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const password2 = document.getElementById('signup-password2').value;
    if (!email || !password) { showError('이메일과 비밀번호를 입력해주세요.'); return; }
    if (password !== password2) { showError('비밀번호가 일치하지 않습니다.'); return; }
    if (password.length < 6) { showError('비밀번호는 6자 이상이어야 합니다.'); return; }
    const { error } = await sb.auth.signUp({ email, password });
    if (error) {
      if (error.message.includes('already registered')) {
        showError('이미 가입된 이메일입니다.');
      } else {
        showError('가입 중 오류가 발생했습니다.');
      }
      return;
    }
    alert('가입 완료! 로그인해주세요.');
    switchTab('login');
  }

  async function handleLogout() {
    await sb.auth.signOut();
  }

  function showApp(user) {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    document.getElementById('user-email-display').textContent = user.email;
  }
  function showAuth() {
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
  }

  sb.auth.onAuthStateChange((event, session) => {
    if (session) {
      showApp(session.user);
    } else {
      showAuth();
    }
  });
</script>
</body>
</html>
